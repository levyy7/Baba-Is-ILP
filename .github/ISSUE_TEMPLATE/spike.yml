name: "🔬 Research Spike"
description: "Investigation. Output is a decision or knowledge, not production code."
title: "[SPIKE] "
labels: ["type:research"]
body:
  - type: textarea
    id: description
    attributes:
      label: The thing to be investigated.
    validations:
      required: true

  - type: textarea
    id: test
    attributes:
      label: How will you test it?
      description: The smallest, cheapest experiment that can help make a decision.
    validations:
      required: true

  - type: textarea
    id: success
    attributes:
      label: Decision Criteria
      description: What will be the output of the investigation and how will we decide it.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Outcome (fill in when closing)
      description: What was learned.
