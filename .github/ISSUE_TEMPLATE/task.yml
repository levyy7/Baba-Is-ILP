name: "🛠️ Task"
description: "Work where 'done' can be specified up front."
title: "[TASK] "
labels: ["type:engineering"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: Concrete, checkable outcomes.
    validations:
      required: true

  - type: textarea
    id: depends
    attributes:
      label: Depends on
      description: Other issue numbers, or a spike outcome this is gated on.

  - type: markdown
    attributes:
      value: |
        ---
        **After opening:** add one `subsystem:*` label and one `effort:*` label.
